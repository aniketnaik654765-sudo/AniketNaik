<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>⚽ FootballBook</h1>

    <h2>Login</h2>


    <label>Email</label>

    <input
        type="email"
        id="loginEmail"
        placeholder="Enter email"
    >


    <label>Password</label>

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
    >


    <button onclick="login()">

        Login

    </button>


    <p id="loginMessage"></p>


    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>


    <hr>


    <p>
        <b>Admin Login</b>
    </p>

    <p>
        Email: admin@gmail.com
    </p>

    <p>
        Password: admin123
    </p>

</div>


<script src="script.js"></script>

</body>
</html>
